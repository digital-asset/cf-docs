name: Mintlify validate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mintlify-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NIX_CONFIG: "extra-experimental-features = nix-command flakes"

jobs:
  mintlify-validate:
    name: mintlify validate
    runs-on: canton-network-cf-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Nix
        uses: cachix/install-nix-action@v31

      - name: Validate external snippet wrapper
        run: nix develop path:nix --command npm run test:external-snippets

      - name: Validate generated-reference history output
        run: >-
          nix develop path:nix --command python3 -m pytest
          tests/test_history_contract.py
          tests/test_reference_page_history.py
          tests/test_openapi_manual_render.py
          tests/test_json_api_openapi.py

      - name: Check JSON Ledger OpenAPI generated output
        run: |
          nix develop path:nix --command python3 scripts/generate_json_api_reference.py
          git diff --exit-code -- \
          docs-main/docs.json \
          docs-main/openapi/json-ledger-api/openapi.yaml \
          docs-main/reference/json-api-reference

      - name: Run Mintlify validation
        run: nix develop path:nix --command bash -c 'cd docs-main && npx mint validate'
